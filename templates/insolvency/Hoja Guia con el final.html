<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja Guía - Insolvencia de Persona Natural</title>
    <link rel="stylesheet" href="/CSS/styles-hoja-guia.css">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo-section">
            <img src="{{LOGO_ENCABEZADO_SRC}}" alt="Logo Constructores de Paz" class="logo">
        </div>

        <!-- Encabezado principal -->
        <div class="encabezado-principal">
            <div class="titulo-proceso">
                <h1>INSOLVENCIA DE PERSONA NATURAL</h1>
            </div>
            <div class="tramite-numero">
                <label>TRAMITE No.</label>
                <input type="text" class="input-field" value="{{NUMERO_TRAMITE}}">
            </div>
        </div>

        <!-- Información del deudor -->
        <div class="info-deudor">
            <div class="campo-info">
                <label>NOMBRE</label>
                <input type="text" class="input-field input-nombre" value="{{NOMBRE_DEUDOR}}">
            </div>
            <div class="campo-info">
                <label>CÉDULA</label>
                <input type="text" class="input-field" value="{{CEDULA_DEUDOR}}">
            </div>
        </div>

        <!-- Tabla de seguimiento -->
        <div class="tabla-seguimiento">
            <table class="tabla-principal">
                <thead>
                    <tr>
                        <th class="col-fecha">FECHA</th>
                        <th class="col-observacion">OBSERVACION</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas de seguimiento se agregarían dinámicamente -->
                    <tr>
                        <td class="input-cell"><input type="date" class="input-fecha"></td>
                        <td class="input-cell"><textarea class="input-observacion" rows="2"></textarea></td>
                    </tr>
                    <tr>
                        <td class="input-cell"><input type="date" class="input-fecha"></td>
                        <td class="input-cell"><textarea class="input-observacion" rows="2"></textarea></td>
                    </tr>
                    <tr>
                        <td class="input-cell"><input type="date" class="input-fecha"></td>
                        <td class="input-cell"><textarea class="input-observacion" rows="2"></textarea></td>
                    </tr>
                    <tr>
                        <td class="input-cell"><input type="date" class="input-fecha"></td>
                        <td class="input-cell"><textarea class="input-observacion" rows="2"></textarea></td>
                    </tr>
                    <tr>
                        <td class="input-cell"><input type="date" class="input-fecha"></td>
                        <td class="input-cell"><textarea class="input-observacion" rows="2"></textarea></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Sección ADMISION -->
        <div class="seccion-header admision">
            <h2>ADMISION</h2>
        </div>

        <div class="grid-consolidados">
            <div class="item-consolidado">
                <label class="label-check">
                    <input type="checkbox">
                    <span>CONSOLIDADO UNIVERSAL</span>
                </label>
            </div>
            <div class="item-consolidado">
                <label class="label-check">
                    <input type="checkbox">
                    <span>CONSOLIDADO SUSPENSION A JUZGADOS</span>
                </label>
            </div>
        </div>

        <div class="grid-seguimiento">
            <div class="item-seguimiento">
                <label class="label-check">
                    <input type="checkbox">
                    <span>SEGUIMIENTO ACTIVAS</span>
                </label>
            </div>
            <div class="item-seguimiento">
                <label class="label-check">
                    <input type="checkbox">
                    <span>OBJECIONES [JZ]</span>
                </label>
            </div>
            <div class="item-seguimiento">
                <label class="label-check">
                    <input type="checkbox">
                    <span>HOJA DE REPARTO</span>
                </label>
            </div>
        </div>

        <!-- Sección FINAL -->
        <div class="seccion-header final">
            <h2>FINAL</h2>
        </div>

        <div class="grid-cierre">
            <div class="item-cierre">
                <label class="label-check">
                    <input type="checkbox">
                    <span>CIERRE - NOTIFICACION (RESULTADO A JUZGADOS)</span>
                </label>
            </div>
            <div class="item-cierre">
                <label class="label-check">
                    <input type="checkbox">
                    <span>SICAAC</span>
                </label>
            </div>
        </div>

        <!-- Centrales de riesgo -->
        <div class="grid-centrales">
            <div class="item-central">
                <label class="label-check">
                    <input type="checkbox">
                    <span>CENTRALES DE RIESGO</span>
                </label>
            </div>
            <div class="item-central">
                <label class="label-check">
                    <input type="checkbox">
                    <span>DATACREDITO</span>
                </label>
            </div>
            <div class="item-central">
                <label class="label-check">
                    <input type="checkbox">
                    <span>CIFIN</span>
                </label>
            </div>
        </div>

        <!-- Resultado -->
        <div class="grid-resultado">
            <div class="label-resultado">
                <strong>RESULTADO</strong>
            </div>
            <div class="item-resultado">
                <label class="label-radio">
                    <input type="radio" name="resultado">
                    <span>ACUERDO</span>
                </label>
            </div>
            <div class="item-resultado">
                <label class="label-radio">
                    <input type="radio" name="resultado">
                    <span>FRACASO</span>
                </label>
            </div>
            <div class="campo-resultado">
                <label>MEDIO DE PAGO</label>
                <input type="text" class="input-field">
            </div>
            <div class="campo-resultado">
                <label>FECHA DE PAGO</label>
                <input type="date" class="input-field">
            </div>
        </div>

        <!-- Otro resultado -->
        <div class="otro-resultado">
            <label><strong>OTRO RESULTADO: ¿Cuál?</strong></label>
            <input type="text" class="input-field input-otro-resultado">
        </div>

        <!-- Sección DILIGENCIAR CONSOLIDADOS -->
        <div class="seccion-header consolidados">
            <h2>DILIGENCIAR CONSOLIDADOS</h2>
        </div>

        <div class="grid-consolidados-finales">
            <div class="item-consolidado-final">
                <label class="label-check">
                    <input type="checkbox">
                    <span>DE RESULTADOS [ACUERDOS Y FRACASOS]</span>
                </label>
            </div>
            <div class="item-consolidado-final">
                <label class="label-check">
                    <input type="checkbox">
                    <span>SUSPENSION A JUZGADOS [FECHA CIERRE]</span>
                </label>
            </div>
            <div class="item-consolidado-final">
                <label class="label-check">
                    <input type="checkbox">
                    <span>LIQUIDACION PATRIMONIAL (ACEPTACION)</span>
                </label>
            </div>
            <div class="campo-radicado">
                <label>RADICADO Y FECHA</label>
                <input type="text" class="input-field">
            </div>
        </div>

        <!-- Sección OBSERVACION FINAL -->
        <div class="seccion-header observacion">
            <h2>OBSERVACION</h2>
        </div>

        <div class="observacion-final">
            <textarea class="textarea-observacion" rows="4" placeholder="Escriba aquí las observaciones finales..."></textarea>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>{{CENTRO_ENTIDAD_PROMOTORA}}<br>
            {{CENTRO_DIRECCION}} {{CENTRO_CIUDAD}}<br>
            Cel. {{CENTRO_TELEFONO}}<br>
            {{CENTRO_WEB}}<br>
            {{CENTRO_EMAIL}}</p>
            <p class="bold">VIGILADO Ministerio de Justicia y del Derecho</p>
        </div>
    </div>
</body>
</html>
