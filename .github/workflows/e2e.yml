name: E2E Tests (Playwright)

on:
  pull_request:
    branches:
      - dev
      - main
  # Allow manual runs from the GitHub UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Deterministic Postgres service — no reliance on external secrets for E2E
    # DB connectivity. Credentials are ephemeral (container-scoped) and match
    # the DATABASE_URL_* env vars below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insolventic_e2e
          POSTGRES_PASSWORD: insolventic_e2e
          POSTGRES_DB: insolventic_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insolventic_e2e -d insolventic_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      # Single DB is shared across both tenants — per-tenant isolation is
      # enforced at the Prisma `tenantId` level, not at the DB level, which
      # is sufficient for E2E smoke tests.
      DATABASE_URL: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      DATABASE_URL_ARMONIA: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      DATABASE_URL_CONSTRUCTORES_PAZ: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      # `directUrl` del datasource. Sin esta var, el step de `prisma db push`
      # falla con "Environment variable not found: DIRECT_URL".
      # El Postgres del runner no tiene pooler, así que es idéntica a
      # DATABASE_URL; en Neon es la misma URL con el host sin `-pooler`.
      DIRECT_URL: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e

      # Test-only secrets. Production values are never used in E2E.
      JWT_SECRET: ci-e2e-jwt-secret-key-for-github-actions-only-123
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-key-for-github-actions-only-456
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-key-for-github-actions-only-789
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to Postgres
        run: npx prisma db push --skip-generate

      - name: Seed deterministic fixtures
        run: npm run db:seed

      # Smoke del wizard de creación de casos contra el Postgres de este job y
      # con el cliente de Prisma REAL. `npm test` (pr.yml) mockea Prisma y no ve
      # errores como "Unknown argument" o una fecha que la base rechaza, que es
      # como se rompió la creación de casos sin que ningún test lo notara. Crea
      # su propio tenant y lo borra al terminar; tests/db/db-guard.ts aborta si
      # DATABASE_URL no es local (aquí lo es: el servicio de arriba).
      - name: DB smoke tests (wizard de casos, Prisma real)
        run: npm run test:db

      # Sin esto, `playwright install --with-deps` descarga Chromium en cada
      # corrida. Medido el 2026-10-01: 28s -> 79s -> 228s -> 572s en cuatro
      # corridas consecutivas (ninguna cambió la versión de Playwright), y en
      # la quinta se comió el timeout-minutes:25 del job antes de correr un
      # solo test. La clave incluye la versión de @playwright/test: un bump
      # invalida el cache en vez de usar binarios desactualizados.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Cache miss: instala navegador + dependencias del sistema (apt).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: el binario de Chromium ya está; solo faltan las
      # dependencias de sistema, que no viven en ~/.cache/ms-playwright y por
      # eso no quedan cubiertas por el cache.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Mismo presupuesto de heap y mismo motivo que en pr.yml: sin esto el
      # build muere con OOM en la fase de type-check (~2050 MB en el runner).
      # El type-check se omite porque el job `quality-checks` de pr.yml ya
      # corre `tsc --noEmit` sobre este mismo commit; repetirlo aquí no aporta
      # cobertura y era el mayor consumo de memoria del job.
      - name: Build Next.js (production mode)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI_SKIP_BUILD_TYPECHECK: '1'

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list,html
        env:
          # Start the built app on port 3000 via Playwright's webServer.
          PLAYWRIGHT_WEB_SERVER_COMMAND: 'npm run start'
          # Ver el bloque ⛔ de src/lib/rate-limit.ts. La clave de login es la
          # IP y aquí todos los tests comparten la del runner, así que la
          # ventana se agota entre archivos. Solo desactiva la APLICACIÓN del
          # límite; RATE_LIMIT_CONFIGS no cambia. Triple candado: además de
          # esta var exige CI==='true' y ausencia de VERCEL.
          E2E_DISABLE_RATE_LIMIT: '1'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
