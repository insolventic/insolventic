name: E2E Tests (Playwright)

on:
  # Quick Win 8 (CLAUDE.md): sin `branches:`, a propósito — mismo motivo que
  # pr.yml. Un PR apilado (base = rama de feature, no dev/main) antes no
  # disparaba este workflow en absoluto.
  pull_request:
  # Allow manual runs from the GitHub UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # SIN service container a propósito. Antes este job levantaba
    # `postgres:16-alpine` como service, y el 2026-10-09 el job falló dos veces
    # seguidas en "Initialize containers" con:
    #
    #   Error response from daemon: toomanyrequests: You have reached your
    #   unauthenticated pull rate limit.
    #
    # El límite de descargas anónimas de Docker Hub es por IP del runner, que es
    # compartida, así que no depende de nosotros ni se arregla reintentando: los
    # tres reintentos del propio runner fallaron igual. Y cuando ese paso falla,
    # TODOS los siguientes quedan `skipped` — incluido `test:db`, que es el gate
    # de los PRs que tocan la base. O sea: el gate quedaba a merced de una
    # lotería externa.
    #
    # La imagen de Ubuntu del runner ya trae PostgreSQL instalado, así que
    # usarlo elimina la dependencia de registries externos y de secretos nuevos.
    # Verificado contra `actions/runner-images` el 2026-10-09:
    # `ubuntu-latest` → Ubuntu 24.04, con **PostgreSQL 16.15** — el mismo major
    # que el `postgres:16-alpine` que reemplaza, y las migraciones no usan
    # ninguna extensión ni nada posterior a 16 (solo `IF EXISTS`, `DO $$`,
    # `information_schema` y un índice único parcial).
    # El servicio viene **deshabilitado** por defecto: hay que arrancarlo.

    env:
      CI: 'true'
      # Single DB is shared across both tenants — per-tenant isolation is
      # enforced at the Prisma `tenantId` level, not at the DB level, which
      # is sufficient for E2E smoke tests.
      DATABASE_URL: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      DATABASE_URL_ARMONIA: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      DATABASE_URL_CONSTRUCTORES_PAZ: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e
      # `directUrl` del datasource. Sin esta var, el step de `prisma db push`
      # falla con "Environment variable not found: DIRECT_URL".
      # El Postgres del runner no tiene pooler, así que es idéntica a
      # DATABASE_URL; en Neon es la misma URL con el host sin `-pooler`.
      DIRECT_URL: postgresql://insolventic_e2e:insolventic_e2e@localhost:5432/insolventic_e2e

      # Test-only secrets. Production values are never used in E2E.
      JWT_SECRET: ci-e2e-jwt-secret-key-for-github-actions-only-123
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-key-for-github-actions-only-456
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-key-for-github-actions-only-789
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      # Reemplaza al service container (ver el comentario de arriba). El rol y
      # la base se llaman igual que antes, así que el bloque `env` de las
      # DATABASE_URL_* no cambia.
      #
      # Dos detalles que no son obvios y que hacen falta:
      #
      #  - CREATEDB en el rol: `tests/db/migraciones-desde-cero.db.test.ts`
      #    (el guardián del replay del historial) crea y borra una base por
      #    corrida. Sin ese atributo falla con "permission denied to create
      #    database". No hace falta SUPERUSER: el rol es dueño de las bases que
      #    crea, así que también puede borrarlas.
      #  - OWNER en la base: desde PostgreSQL 15 el schema `public` ya no es
      #    escribible por cualquiera; pertenece a `pg_database_owner`. Creando
      #    la base con OWNER el rol hereda CREATE sobre `public` y
      #    `prisma db push` puede crear las tablas.
      - name: Start preinstalled PostgreSQL and create the E2E role/database
        run: |
          sudo systemctl start postgresql.service
          # Esperar a que acepte conexiones: `systemctl start` vuelve antes de
          # que el postmaster esté listo.
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done
          pg_isready -h localhost -p 5432
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE insolventic_e2e WITH LOGIN PASSWORD 'insolventic_e2e' CREATEDB;
          CREATE DATABASE insolventic_e2e OWNER insolventic_e2e;
          SQL
          # Prueba de humo de la conexión que van a usar Prisma y los tests:
          # por TCP, con contraseña, como el rol de la aplicación.
          PGPASSWORD=insolventic_e2e psql -h localhost -U insolventic_e2e \
            -d insolventic_e2e -c 'SELECT version();'

      - name: Apply schema to Postgres
        run: npx prisma db push --skip-generate

      - name: Seed deterministic fixtures
        run: npm run db:seed

      # Smoke del wizard de creación de casos contra el Postgres de este job y
      # con el cliente de Prisma REAL. `npm test` (pr.yml) mockea Prisma y no ve
      # errores como "Unknown argument" o una fecha que la base rechaza, que es
      # como se rompió la creación de casos sin que ningún test lo notara. Crea
      # su propio tenant y lo borra al terminar; tests/db/db-guard.ts aborta si
      # DATABASE_URL no es local (aquí lo es: el servicio de arriba).
      - name: DB smoke tests (wizard de casos, Prisma real)
        run: npm run test:db

      # Sin esto, `playwright install --with-deps` descarga Chromium en cada
      # corrida. Medido el 2026-10-01: 28s -> 79s -> 228s -> 572s en cuatro
      # corridas consecutivas (ninguna cambió la versión de Playwright), y en
      # la quinta se comió el timeout-minutes:25 del job antes de correr un
      # solo test. La clave incluye la versión de @playwright/test: un bump
      # invalida el cache en vez de usar binarios desactualizados.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Cache miss: instala navegador + dependencias del sistema (apt).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: el binario de Chromium ya está; solo faltan las
      # dependencias de sistema, que no viven en ~/.cache/ms-playwright y por
      # eso no quedan cubiertas por el cache.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Mismo presupuesto de heap y mismo motivo que en pr.yml: sin esto el
      # build muere con OOM en la fase de type-check (~2050 MB en el runner).
      # El type-check se omite porque el job `quality-checks` de pr.yml ya
      # corre `tsc --noEmit` sobre este mismo commit; repetirlo aquí no aporta
      # cobertura y era el mayor consumo de memoria del job.
      - name: Build Next.js (production mode)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI_SKIP_BUILD_TYPECHECK: '1'

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list,html
        env:
          # Start the built app on port 3000 via Playwright's webServer.
          PLAYWRIGHT_WEB_SERVER_COMMAND: 'npm run start'
          # Ver el bloque ⛔ de src/lib/rate-limit.ts. La clave de login es la
          # IP y aquí todos los tests comparten la del runner, así que la
          # ventana se agota entre archivos. Solo desactiva la APLICACIÓN del
          # límite; RATE_LIMIT_CONFIGS no cambia. Triple candado: además de
          # esta var exige CI==='true' y ausencia de VERCEL.
          E2E_DISABLE_RATE_LIMIT: '1'

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
