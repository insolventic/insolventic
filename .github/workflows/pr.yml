name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.base_ref == 'main' && 'production' || 'development' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run postinstall --if-present

      - name: Pull Vercel environment info
        run: |
          npx vercel pull --yes --environment=$DEPLOY_ENV --token=$VERCEL_TOKEN
          cp .vercel/.env.$DEPLOY_ENV.local .env

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # Visible en cada PR pero no bloquea el merge: las vulnerabilidades
      # de dependencias se atienden como tarea propia, no frenan features.
      - name: Dependency audit (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit & integration tests
        run: npx jest --ci
        env:
          CI: 'true'
          JWT_SECRET: ci-test-secret-key-for-github-actions-only

      - name: Build (type & syntax check)
        run: npm run build
