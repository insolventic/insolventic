name: CI

on:
  # Quick Win 8 (CLAUDE.md): sin `branches:`, a propósito. Con el filtro
  # (`[dev, main]`), un PR cuya base es una rama de feature (un PR apilado
  # sobre otro PR sin mergear todavía) no disparaba este workflow en
  # absoluto — ni rojo ni skipped, simplemente no se encolaba, que es más
  # fácil de pasar por alto que un check en rojo. El costo es correr CI
  # también en PRs apilados; es exactamente lo que se buscaba.
  pull_request:
  # Hasta ahora este workflow solo corría en el PR, contra el commit que
  # todavía no está en dev. Un merge (rebase, merge commit o squash) produce
  # un commit NUEVO en dev que nunca se compiló ni testeó como tal — la única
  # verificación posterior era local, a mano, por quien mergeaba. Este trigger
  # corre quality-checks también sobre ese commit real.
  push:
    branches:
      - dev
      # Y main, por los mismos dos motivos: el commit que sale del squash de
      # `dev -> main` es nuevo y nunca se compilo como tal, y es el commit que
      # se despliega a produccion, asi que es el que necesita sus source maps
      # en Sentry (ver el step "Subir source maps").
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.base_ref == 'main' && 'production' || 'development' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # A nivel de job y no del step: el contexto `env` de un `if` de step solo
      # ve el env del job o del workflow, no el que declara el propio step, asi
      # que la condicion "hay token" no se podria escribir de la otra forma.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run postinstall --if-present

      - name: Pull Vercel environment info
        run: |
          npx vercel pull --yes --environment=$DEPLOY_ENV --token=$VERCEL_TOKEN
          cp .vercel/.env.$DEPLOY_ENV.local .env

      - name: Lint
        run: npm run lint

      # El type-check del proyecto necesita >2 GB de heap (el modelo Case tiene
      # 293 campos y los tipos generados de Prisma son ~22% de los 277k tipos
      # que instancia tsc). Sin este NODE_OPTIONS el step pasa por poco y es
      # candidato a empezar a fallar solo.
      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Visible en cada PR pero no bloquea el merge: las vulnerabilidades
      # de dependencias se atienden como tarea propia, no frenan features.
      - name: Dependency audit (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit & integration tests
        run: npx jest --ci
        env:
          CI: 'true'
          JWT_SECRET: ci-test-secret-key-for-github-actions-only

      # `next build` volvía a type-chequear todo lo que el step "Type check" de
      # arriba ya validó, y esa segunda pasada era ~2/3 del pico de memoria:
      # el build OOM-eaba a los ~2050 MB que da el worker del runner.
      # CI_SKIP_BUILD_TYPECHECK desactiva SOLO esa comprobación duplicada
      # (ver el bloque de aviso en next.config.ts). El build sigue validando
      # sintaxis y bundling; los errores de tipos los sigue bloqueando el step
      # "Type check", que corre antes en este mismo job.
      - name: Build (syntax & bundling)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CI_SKIP_BUILD_TYPECHECK: '1'
          # El release se embute en el bundle del cliente en tiempo de build, y
          # tiene que ser el MISMO string que reportara el bundle que Vercel
          # despliega de este commit (alla lo pone Vercel). Si no coincide,
          # Sentry no encuentra los mapas.
          NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

      # O-1: sin esto, cada error de produccion apunta a
      # `chunks/740-79d2c44d906524ae.js:1:48213`. No se usa
      # `withSentryConfig()` a proposito —reabre el ENOENT de
      # `@opentelemetry/api` que rompio los deploys en agosto, ver
      # next.config.ts—, asi que los mapas se suben aparte, desde aca, con el
      # SHA del commit como nombre de release.
      #
      # Solo en push (dev/main): en un PR el commit no se despliega, y subir
      # sus mapas ensuciaria el proyecto de Sentry con releases que no existen.
      #
      # Inerte hasta que el secret exista: sin SENTRY_AUTH_TOKEN el step se
      # saltea y el resto del job sigue igual. Lo que hace falta para
      # encenderlo esta en docs/RUNBOOK.md §8.
      - name: Subir source maps a Sentry
        if: >-
          github.event_name == 'push' &&
          env.SENTRY_AUTH_TOKEN != ''
        # `continue-on-error`: Sentry caido o un token vencido no pueden
        # bloquear el merge. El sintoma de que fallo es un stack trace
        # minificado, no un CI en rojo, y el paso queda en amarillo en la
        # corrida.
        continue-on-error: true
        run: |
          npx --yes @sentry/cli@2 releases new "$GITHUB_SHA"
          npx --yes @sentry/cli@2 sourcemaps inject .next
          npx --yes @sentry/cli@2 sourcemaps upload             --release "$GITHUB_SHA"             --url-prefix '~/_next'             .next/static/chunks
          npx --yes @sentry/cli@2 releases set-commits "$GITHUB_SHA" --auto
          npx --yes @sentry/cli@2 releases finalize "$GITHUB_SHA"
