name: Deploy

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # `dev` → Vercel preview deployment; `main` → production.
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set git author for Vercel team access
        run: |
          git config user.email "insolvenic@gmail.com"
          git config user.name "Insolventic"
          git commit --amend --reset-author --no-edit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pull Vercel environment info
        run: |
          npx vercel pull --yes --environment=$DEPLOY_ENV --token=$VERCEL_TOKEN
          cp .vercel/.env.$DEPLOY_ENV.local .env

      - name: Install dependencies (npm ci)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npm run postinstall --if-present

      - name: Baseline initial migration (if needed)
        run: npx prisma migrate resolve --applied 20260205212559_init 2>/dev/null || true

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build Vercel project (prebuilt output)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx vercel build --prod --token $VERCEL_TOKEN
          else
            npx vercel build --token $VERCEL_TOKEN
          fi

      - name: Deploy to Vercel
        run: |
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx vercel deploy --prod --prebuilt --token $VERCEL_TOKEN
          else
            npx vercel deploy --prebuilt --token $VERCEL_TOKEN
          fi
